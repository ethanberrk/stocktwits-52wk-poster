# .github/workflows/tick.yml
name: tick
on:
  # Ticks are driven solely by cron-job.org (jobId 8021029), which POSTs a
  # workflow_dispatch on the :00/:30 slots, 13:00-21:30 UTC weekdays. run.py
  # gates market hours precisely. GitHub's own `schedule` cron was removed
  # 2026-07-09: it delivered ~27% of its slots at arbitrary minutes (7-56 min
  # late), so its late fires landed in a different half-hour window than the
  # dispatch and posted an extra ticker, compressing the 30-min trickle and
  # exhausting the daily cap ~2 hours before the close.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run tick
        env:
          STOCKTWITS_ACCESS_TOKEN: ${{ secrets.STOCKTWITS_ACCESS_TOKEN }}
          # Launch ramp: 1 post/tick (a gentle 30-min trickle that dodges the
          # duplicate filter), 12/day for broader coverage. Revert (remove these
          # two) once posting looks healthy — defaults are 2/20.
          MAX_PER_TICK: "1"
          MAX_PER_DAY: "12"
          PYTHONUNBUFFERED: "1"
        run: python run.py --sync-state --live
      - name: Commit state + output
        # always(): if the tick crashed mid-posting, the pending/confirmed
        # state on disk must still be persisted so nothing double-posts
        if: always()
        run: |
          git config user.name "52wk-poster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state output
          if git diff --cached --quiet; then
            echo "nothing posted this tick"; exit 0
          fi
          git commit -m "state: tick $(date -u +'%Y-%m-%dT%H:%M')"
          git pull --rebase origin main
          git push
