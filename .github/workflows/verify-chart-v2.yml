# TEMPORARY: exercises the live chart-img v2 endpoint on this branch.
# Delete before merging — kept only to prove the GET->POST/v2 migration works.
name: verify-chart-v2
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: live v2 contract test
        env:
          CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
        run: python -m pytest -m contract tests/contract/test_live_chart_img.py -v
